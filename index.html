<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Stops the HTML document itself from being cached, so a new build is
         always fetched instead of a stale index.html sticking around. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Nami Wealth Terminal</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>">
    <link rel="stylesheet" href="styles.css?v=1.3.0">
    <!-- Tailwind is pre-compiled (tailwind.build.css) instead of the JIT CDN
         script — avoids the "should not be used in production" console
         warning and ships only the utility classes this app actually uses. -->
    <link rel="stylesheet" href="tailwind.build.css?v=1.3.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
</head>
<body class="p-4 md:p-10 max-w-[1750px] mx-auto relative">

    <div id="build-tag" class="absolute top-4 right-4 md:top-10 md:right-10 font-mono text-[10px] font-black uppercase opacity-60 bg-black text-white px-2 py-1 rounded z-50">
        BUILD: LOADING...
    </div>

    <div id="main-content">
        <header class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-10 gap-8">
            <div class="max-w-xl">
                <h1 class="text-3xl md:text-5xl lg:text-6xl font-black italic nami-header uppercase">Nami Wealth Terminal</h1>
                <p id="status-text" class="bg-black text-white inline-block px-3 py-1 text-[10px] font-black uppercase mt-2">Connecting... 📡</p>
            </div>
            
            <div class="funky-card bg-white p-6 md:p-10 text-center flex flex-col items-center justify-center w-full lg:w-auto min-w-full lg:min-w-[450px]">
                <span class="text-[10px] md:text-xs font-black uppercase text-gray-400 tracking-[0.2em] mb-3">Consolidated Net Worth 🌍</span>
                <div class="flex flex-col md:flex-row items-center gap-2 md:gap-6">
                    <div id="total-networth" class="text-4xl md:text-6xl font-black stat-val">$0</div>
                    <div id="growth-badge" class="mt-1 md:mt-0"></div>
                </div>
            </div>
        </header>

        <div class="mb-8">
            <div class="funky-card bg-white p-4 md:p-8 w-full">
                <h2 class="text-center font-black uppercase mb-4 italic text-lg md:text-2xl text-pink-600">Wealth Progression 📈</h2>
                <div class="h-[250px] md:h-[350px]"><canvas id="progressChart"></canvas></div>
            </div>
        </div>
        
        <div class="mb-10 flex justify-center">
            <div class="funky-card bg-white p-4 md:p-6 w-full max-w-2xl h-[400px] md:h-[480px]">
                <h2 class="text-center font-black uppercase mb-4 italic text-base md:text-xl">Asset Distribution 📊</h2>
                <canvas id="categoryChart"></canvas>
            </div>
        </div>
        
        <div id="matrix-container" class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-6 mb-16"></div>
    </div>

    <div id="detail-drawer" class="fixed inset-0 z-[10000] bg-black/40 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300">
        <div id="drawer-content" class="absolute bottom-0 left-0 right-0 bg-slate-100 rounded-t-[40px] p-8 translate-y-full transition-all duration-500 border-t-8 border-black max-h-[90vh] overflow-y-auto"></div>
    </div>

     <script type="module">
        // ── SINGLE SOURCE OF TRUTH ──────────────────────────────────────────
        // Bump ONLY this string (and the two ?v= links up in <head>) to ship
        // a new build. main.js and components.js read their own version back
        // out of the URL they were loaded with (import.meta.url), so their
        // internal imports of each other/utils.js stay in sync automatically
        // — no more hunting through 3 files to update 5 different ?v= tags.
        const VERSION = "1.3.0";

        const tag = document.getElementById('build-tag');
        if (tag) tag.innerText = `BUILD: v${VERSION}`;

        console.log(
            `%cNami Wealth Terminal — Build v${VERSION}`,
            'color:#FF00FF; font-weight:900; font-size:14px;'
        );

        import(`./main.js?v=${VERSION}`).then(() => {
            console.log("JS Module Handshake Successful ✅");
        }).catch(err => {
            document.getElementById('status-text').innerText = "Terminal Crash ❌";
            console.error("Module Import Failed:", err);
    });
</script>
</body>
</html>
